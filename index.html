<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#292d31"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Gestor de Tornejos · Les Cabanyes</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#272b30;background:#f2f3f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{background:#292d31;color:white;padding:25px 15px;display:flex;flex-direction:column;gap:24px;min-height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:5px 8px 15px;border-bottom:1px solid #51565a}.brand img{max-width:65px;max-height:64px;object-fit:contain}.brand .mark{font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;width:52px;height:52px;background:#292d31;border-radius:10px;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain}.brand strong{font-size:14px;letter-spacing:.04em;display:block}.brand small{font-size:11px;color:#bfc3c6}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#d6d9db;text-align:left;border-radius:11px;padding:13px 15px;font-size:14px}.nav button.active,.nav button:hover{background:#484e53;color:white}.aside-foot{margin-top:auto;font-size:11px;color:#abb0b4;padding:10px;line-height:1.5}main{min-width:0;padding:27px 34px 55px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:24px;flex-wrap:wrap}.eyebrow{color:#737a80;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:750}.top h1{font-size:clamp(24px,3vw,33px);letter-spacing:-.045em;margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d4d7da;border-radius:10px;padding:10px 13px;background:white;color:#292d31;font-weight:650;font-size:13px;min-height:40px}.btn.primary{background:#30353a;color:white;border-color:#30353a}.btn.danger{color:#a33434}.btn.small{padding:6px 10px;min-height:31px;font-size:12px}.btn:hover{filter:brightness(.96)}.panel{background:white;border:1px solid #e0e3e5;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px #1b252b07}.panel h2{font-size:17px;margin:0 0 13px}.panel h3{font-size:14px;margin:0 0 10px}.muted{color:#788087;font-size:13px;line-height:1.55}.hero{background:#30353a;color:white;border-radius:18px;padding:25px;margin-bottom:18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{font-size:26px;margin:6px 0}.hero p{color:#d1d4d6;margin:0}.hero .btn{background:white;color:#292d31}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.metric{background:white;border:1px solid #e0e3e5;border-radius:14px;padding:18px}.metric b{display:block;font-size:29px;letter-spacing:-.05em}.metric span{color:#788087;font-size:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:700;color:#666e74}.field input,.field select{width:100%;border:1px solid #d6dadd;border-radius:9px;padding:10px;background:#fff;min-height:40px;color:#25292d}.field input[type=checkbox]{width:auto;min-height:auto}.formrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.formrow>.field{flex:1;min-width:145px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 17px}.pill{border:1px solid #d7dbdd;background:white;color:#444b50;padding:9px 13px;border-radius:50px;font-size:13px;font-weight:650}.pill.active{background:#30353a;color:white;border-color:#30353a}.tablewrap{overflow-x:auto;border:1px solid #e4e6e8;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f1;vertical-align:middle}th{background:#f7f8f9;color:#687078;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.tag{display:inline-block;background:#eceff0;color:#4e555a;padding:5px 9px;border-radius:50px;font-size:11px;font-weight:750}.tag.win{background:#e5f2e8;color:#286c3a}.tag.pending{background:#fff4dd;color:#8c6219}.cardrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eceeef}.cardrow:last-child{border:0}.cardrow b{display:block;font-size:14px}.cardrow small{color:#7a8288}.pair{display:flex;align-items:center;gap:9px}.pairnum{background:#e9ebed;color:#555c61;border-radius:8px;padding:7px;min-width:27px;text-align:center;font-weight:800;font-size:11px}.matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}.match{border:1px solid #e2e5e7;border-radius:12px;padding:13px;background:#fff}.matchtop{display:flex;justify-content:space-between;align-items:center;color:#7b8288;font-size:11px;margin-bottom:12px;gap:6px}.teams{display:grid;gap:7px}.team{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f4f5f6;border-radius:8px;font-size:13px;min-height:35px}.team.winner{background:#e9f2ec;font-weight:750}.score{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.matchfooter{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.bracket{display:flex;gap:15px;overflow-x:auto;padding:6px 0 16px;align-items:flex-start}.round{min-width:245px;max-width:265px;flex:1;display:grid;gap:12px}.round h3{padding:0 4px}.round .match{min-height:132px}.empty{padding:34px;text-align:center;border:1px dashed #ccd1d4;border-radius:13px;color:#798087;background:#fafbfb}.notice{border-left:3px solid #858d94;padding:12px 14px;background:#f2f4f5;color:#555e65;border-radius:5px;font-size:13px;line-height:1.5;margin:12px 0}.dangertext{color:#a33434}.divider{height:1px;background:#e6e8e9;margin:18px 0}.mini{font-size:11px;color:#777f85}.hidden{display:none!important}dialog{border:0;border-radius:17px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 30px 100px #0005}dialog::backdrop{background:#20272cb3}.modal{padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{margin:0;font-size:20px}.modal .field{margin-top:13px}.modalbuttons{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.checkline{display:flex;gap:8px;align-items:center;font-size:13px}.checkline input{width:auto}.toast{position:fixed;bottom:20px;right:20px;background:#30353a;color:white;border-radius:10px;padding:12px 18px;box-shadow:0 5px 20px #0003;z-index:5;font-size:13px}.tabline{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.tabline select{max-width:280px}.roundlabel{font-weight:700;font-size:12px;color:#747b80;text-transform:uppercase;letter-spacing:.06em}.setup-list{display:grid;gap:12px}.setup-item{padding:13px;border:1px solid #e3e6e8;border-radius:12px}.setup-item .grid3{margin-top:10px}@media(max-width:860px){.app{grid-template-columns:1fr}aside{min-height:auto;padding:12px 16px;gap:9px}.brand{padding:2px 4px 10px}.nav{display:flex;overflow-x:auto;white-space:nowrap}.nav button{padding:10px 12px}.aside-foot{display:none}main{padding:18px 15px 35px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.hero{padding:18px}.hero h2{font-size:21px}}@media(max-width:500px){.grid3{grid-template-columns:1fr}.top h1{font-size:24px}.metric{padding:12px}.hero{display:block}.hero .btn{margin-top:15px}}
</style></head><body><div class="app"><aside><div class="brand"><div id="brand-logo" class="mark">◈</div><div><strong>PÀDEL INDOOR</strong><small>LES CABANYES · TORNEJOS</small></div></div><nav class="nav" id="nav"></nav><div class="aside-foot">Gestió privada · publicació de resultats<br>Fes còpies de seguretat periòdicament.</div></aside><main><header class="top"><div><div class="eyebrow" id="subheading">Gestió esportiva</div><h1 id="heading">Els meus tornejos</h1></div><div class="actions" id="top-actions"></div></header><div id="view"></div></main></div><dialog id="dialog"><div class="modal"><div class="modalhead"><h2 id="dialog-title"></h2><button class="btn small" onclick="closeDialog()">✕</button></div><form id="dialog-form"><div id="dialog-body"></div><div class="modalbuttons"><button type="button" class="btn" onclick="closeDialog()">Cancel·lar</button><button type="submit" class="btn primary">Desar</button></div></form></div></dialog><input type="file" id="importfile" accept=".json,application/json" hidden><input type="file" id="logofile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden><script>
'use strict';
const KEY='pic_tournaments_v1';const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opt=(list,v)=>list.map(x=>`<option value="${esc(x)}" ${String(x)===String(v)?'selected':''}>${esc(x)}</option>`).join('');
function group(name){return {id:uid(),name,format:{games:9,tie:true,tiePoints:7,golden:true},qualify:4,pairIds:[],matches:[]}}
function category(name){return {id:uid(),name,groups:[group('A'),group('B')],pairs:[],rounds:[],knockout:{games:9,tie:true,tiePoints:7,golden:true,finalSets:3},qualifiers:4}}
function tournament(name='Nou torneig',date=''){return {id:uid(),name,date,start:'09:00',courts:1,notes:'',categories:[],created:new Date().toISOString()}}
function seed(){let t=tournament('Express Puríssima 2026','2026-12-05');t.categories=['2a Masculina','3a Masculina','4a Masculina','3a Femenina','4a Femenina'].map(category);return {version:1,active:t.id,logo:'',tournaments:[t]}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(data.tournaments))throw Error('invalid')}catch(e){data=seed()}let page='home',selectedCat='',selectedGroup='';const active=()=>data.tournaments.find(t=>t.id===data.active)||data.tournaments[0];const cat=()=>active()?.categories.find(c=>c.id===selectedCat)||active()?.categories[0];const grp=()=>cat()?.groups.find(g=>g.id===selectedGroup)||cat()?.groups[0];const pair=(c,id)=>c.pairs.find(p=>p.id===id);const pname=(c,id)=>id?(pair(c,id)?.name||'Parella eliminada'):'Per determinar';const formatText=f=>f?`A ${f.games} jocs${f.tie?` · TB ${f.games-1}–${f.games-1}`:''}${f.golden?' · punt d’or':''}`:'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('No s’ha pogut desar. Exporta una còpia i allibera espai.');return false}}function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3200)}
function navTo(p){page=p;render()}function chooseCat(id){selectedCat=id;selectedGroup='';render()}function chooseGroup(id){selectedGroup=id;render()}
const navItems=[['home','▦','Tornejos'],['pairs','♙','Categories i parelles'],['groups','▤','Grups i classificació'],['matches','▣','Partits i horaris'],['bracket','◇','Eliminatòries'],['settings','⚙','Configuració']];
function render(){let t=active(),c=cat();document.getElementById('brand-logo').innerHTML=`<img src="${data.logo||'logo-oficial.png'}" alt="Logo oficial">`;document.getElementById('nav').innerHTML=navItems.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="navTo('${p}')">${i} &nbsp; ${n}</button>`).join('');document.getElementById('heading').textContent=navItems.find(x=>x[0]===page)?.[2]||'Tornejos';document.getElementById('subheading').textContent=page==='home'?'Pàdel Indoor Les Cabanyes':t?.name||'Sense torneig';document.getElementById('top-actions').innerHTML=`<button class="btn" onclick="exportData()">↓ Còpia de seguretat</button>${page==='home'?'<button class="btn primary" onclick="editTournament()">+ Nou torneig</button>':''}`;let html={home:homeView,pairs:pairsView,groups:groupsView,matches:matchesView,bracket:bracketView,settings:settingsView}[page]();document.getElementById('view').innerHTML=html}
function hero(){let t=active();return `<div class="hero"><div><div class="eyebrow" style="color:#c4c9cd">TORNEIG ACTIU</div><h2>${esc(t.name)}</h2><p>${esc(t.date||'Data pendent')} · ${t.categories.length} categories</p></div><button class="btn" onclick="navTo('pairs')">Gestionar torneig →</button></div>`}
function homeView(){let t=active(),pairs=t.categories.reduce((s,c)=>s+c.pairs.length,0),played=t.categories.reduce((s,c)=>s+c.groups.reduce((a,g)=>a+g.matches.filter(m=>m.result).length,0)+c.rounds.reduce((a,r)=>a+r.matches.filter(m=>m.result).length,0),0),matches=t.categories.reduce((s,c)=>s+c.groups.reduce((a,g)=>a+g.matches.length,0)+c.rounds.reduce((a,r)=>a+r.matches.length,0),0);return `${hero()}<div class="metrics"><div class="metric"><b>${t.categories.length}</b><span>Categories</span></div><div class="metric"><b>${pairs}</b><span>Parelles inscrites</span></div><div class="metric"><b>${played}/${matches}</b><span>Partits disputats</span></div><div class="metric"><b>${data.tournaments.length}</b><span>Tornejos desats</span></div></div><div class="grid2"><section class="panel"><h2>Els meus tornejos</h2>${data.tournaments.map(x=>`<div class="cardrow"><div><b>${esc(x.name)}</b><small>${esc(x.date||'Sense data')} · ${x.categories.length} categories</small></div><div class="actions"><button class="btn small ${x.id===t.id?'primary':''}" onclick="activate('${x.id}')">${x.id===t.id?'Actiu':'Obrir'}</button><button class="btn small" onclick="duplicateTournament('${x.id}')">Duplicar</button></div></div>`).join('')}</section><section class="panel"><h2>Comença per aquí</h2><div class="cardrow"><div><b>1. Categories i parelles</b><small>Edita categories i inscriu les parelles</small></div><button class="btn small" onclick="navTo('pairs')">Obrir</button></div><div class="cardrow"><div><b>2. Grups</b><small>Distribueix parelles i genera els partits</small></div><button class="btn small" onclick="navTo('groups')">Obrir</button></div><div class="cardrow"><div><b>3. Resultats i eliminatòries</b><small>Entra marcadors i genera els encreuaments</small></div><button class="btn small" onclick="navTo('matches')">Obrir</button></div><div class="notice">Les dades es guarden automàticament en aquest iPad. Exporta una còpia JSON després de cada jornada.</div></section></div>`}
function activate(id){data.active=id;selectedCat='';selectedGroup='';save();render()}
function editTournament(id){let old=id?data.tournaments.find(t=>t.id===id):null;modal(old?'Editar torneig':'Nou torneig',`<div class="field"><label>Nom del torneig</label><input name="name" required value="${esc(old?.name||'')}"></div><div class="grid2"><div class="field"><label>Data</label><input name="date" type="date" value="${esc(old?.date||'')}"></div><div class="field"><label>Hora inicial</label><input name="start" type="time" value="${esc(old?.start||'09:00')}"></div></div><div class="field"><label>Nombre de pistes</label><input name="courts" type="number" min="1" max="99" value="${old?.courts||1}"></div>`,v=>{if(old){Object.assign(old,{name:v.name,date:v.date,start:v.start,courts:+v.courts})}else{let t=tournament(v.name,v.date);t.start=v.start;t.courts=+v.courts;data.tournaments.unshift(t);data.active=t.id;selectedCat=''}save();render()})}
function duplicateTournament(id){let orig=data.tournaments.find(t=>t.id===id);if(!orig)return;let copy=tournament(orig.name+' · còpia',orig.date);copy.start=orig.start;copy.courts=orig.courts;copy.categories=orig.categories.map(c=>{let n=category(c.name);n.qualifiers=c.qualifiers;n.knockout={...c.knockout};n.groups=c.groups.map(g=>({...group(g.name),format:{...g.format},qualify:g.qualify}));return n});data.tournaments.unshift(copy);data.active=copy.id;selectedCat='';save();render();toast('Torneig duplicat sense resultats ni parelles')}
function categoryTabs(){let t=active();return `<div class="pills">${t.categories.map(c=>`<button class="pill ${cat()?.id===c.id?'active':''}" onclick="chooseCat('${c.id}')">${esc(c.name)}</button>`).join('')}</div>`}
function pairsView(){let t=active(),c=cat();return `<section class="panel"><div class="formrow"><h2 style="flex:1;margin:0">Categories del torneig</h2><button class="btn" onclick="editTournament('${t.id}')">Editar torneig</button><button class="btn primary" onclick="editCategory()">+ Categoria</button></div>${t.categories.length?categoryTabs():'<div class="empty">Encara no hi ha categories. Crea’n una.</div>'}</section>${c?`<section class="panel"><div class="formrow"><h2 style="flex:1;margin:0">${esc(c.name)} · ${c.pairs.length} parelles</h2><button class="btn" onclick="editCategory('${c.id}')">Editar categoria</button><button class="btn danger" onclick="deleteCategory('${c.id}')">Eliminar categoria</button><button class="btn primary" onclick="editPair()">+ Parella</button></div><div class="notice">Per assignar les parelles als grups, fes servir el selector de cada parella. Els canvis de grup invaliden els partits i eliminatòries ja generats; rebràs un avís abans de modificar-los.</div>${c.pairs.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Parella</th><th>Grup</th><th>Accions</th></tr></thead><tbody>${c.pairs.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td>${esc(c.groups.find(g=>g.pairIds.includes(p.id))?.name||'Sense assignar')}</td><td><button class="btn small" onclick="editPair('${p.id}')">Editar</button> <button class="btn small danger" onclick="deletePair('${p.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Cap parella inscrita. Afegeix la primera parella.</div>'}</section>`:''}`}
function editCategory(id){let t=active(),c=t.categories.find(c=>c.id===id);modal(c?'Editar categoria':'Nova categoria',`<div class="field"><label>Nom</label><input name="name" required value="${esc(c?.name||'')}"></div>`,v=>{if(c)c.name=v.name;else{let n=category(v.name);t.categories.push(n);selectedCat=n.id}save();render()})}
function deleteCategory(id){let t=active(),c=t.categories.find(x=>x.id===id);if(!c||!confirm('Eliminar la categoria '+c.name+' i totes les parelles, partits i resultats?'))return;t.categories=t.categories.filter(x=>x.id!==id);selectedCat='';selectedGroup='';save();render()}
function hasResults(c){return c.groups.some(g=>g.matches.some(m=>m.result))||c.rounds.some(r=>r.matches.some(m=>m.result))}
function invalidate(c){c.groups.forEach(g=>g.matches=[]);c.rounds=[]}
function editPair(id){let c=cat(),p=c.pairs.find(x=>x.id===id),g=c.groups.find(g=>g.pairIds.includes(id));modal(p?'Editar parella':'Nova parella',`<div class="field"><label>Nom de la parella (jugador/a 1 · jugador/a 2)</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>Grup</label><select name="group"><option value="">Sense assignar</option>${c.groups.map(x=>`<option value="${x.id}" ${g?.id===x.id?'selected':''}>Grup ${esc(x.name)}</option>`).join('')}</select></div>`,v=>{if(p){if(g?.id!==v.group){if((c.groups.some(g=>g.matches.length)||c.rounds.length)&&!confirm('Canviar de grup esborrarà tots els partits i resultats d’aquesta categoria. Continuar?'))return false;invalidate(c)}p.name=v.name;c.groups.forEach(g=>g.pairIds=g.pairIds.filter(x=>x!==p.id));if(v.group)c.groups.find(g=>g.id===v.group)?.pairIds.push(p.id)}else{let np={id:uid(),name:v.name};c.pairs.push(np);if(v.group)c.groups.find(g=>g.id===v.group)?.pairIds.push(np.id)}save();render()})}
function deletePair(id){let c=cat();if(!confirm('Eliminar aquesta parella? També s’eliminaran els partits i resultats de la categoria.'))return;invalidate(c);c.pairs=c.pairs.filter(p=>p.id!==id);c.groups.forEach(g=>g.pairIds=g.pairIds.filter(p=>p!==id));save();render()}
function groupSelect(){let c=cat();return `<div class="tabline"><span class="roundlabel">Grup</span>${c.groups.map(g=>`<button class="pill ${grp()?.id===g.id?'active':''}" onclick="chooseGroup('${g.id}')">${esc(g.name)}</button>`).join('')}</div>`}
function groupsView(){let c=cat();if(!c)return `<div class="empty">Crea una categoria primer.</div>`;let g=grp(),rank=standings(c,g);return `<section class="panel"><div class="formrow"><h2 style="flex:1;margin:0">${esc(c.name)}</h2><button class="btn" onclick="addGroup()">+ Grup</button><button class="btn" onclick="editGroup('${g.id}')">Editar grup</button><button class="btn danger" onclick="deleteGroup('${g.id}')">Eliminar grup</button><button class="btn primary" onclick="generateGroup('${g.id}')">Generar partits</button></div>${categoryTabs()}${groupSelect()}<div class="notice">${esc(formatText(g.format))} · ${g.pairIds.length} parelles · ${g.matches.length} partits · ${g.qualify} classificades previstes. La classificació ordena per victòries, diferència de jocs i jocs a favor.</div><h2>Classificació · Grup ${esc(g.name)}</h2>${rank.length?`<div class="tablewrap"><table><thead><tr><th>Pos.</th><th>Parella</th><th>PJ</th><th>PG</th><th>PP</th><th>JF</th><th>JC</th><th>Dif.</th></tr></thead><tbody>${rank.map((r,i)=>`<tr><td><span class="tag ${i<g.qualify?'win':''}">${i+1}</span></td><td><b>${esc(r.name)}</b></td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td><td>${r.jf}</td><td>${r.jc}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Assigna parelles a aquest grup.</div>'}<div class="divider"></div><h2>Partits del grup</h2>${renderMatches(c,g.matches,'group',g.id)}</section>`}
function deleteGroup(id){let c=cat();if(c.groups.length<2)return toast('Cal conservar almenys un grup');let g=c.groups.find(x=>x.id===id);if(!g||!confirm('Eliminar el grup '+g.name+'? Les parelles quedaran sense assignar i es perdran tots els resultats de la categoria.'))return;invalidate(c);c.groups=c.groups.filter(x=>x.id!==id);selectedGroup='';save();render()}
function addGroup(){let c=cat();modal('Afegir grup',`<div class="field"><label>Nom del grup</label><input name="name" required placeholder="C"></div>`,v=>{if(c.groups.some(g=>g.name.toLowerCase()===v.name.toLowerCase())){toast('Ja existeix aquest grup');return false}let g=group(v.name);c.groups.push(g);selectedGroup=g.id;save();render()})}

function editGroup(id){let c=cat(),g=c.groups.find(x=>x.id===id);modal('Editar grup '+g.name,`<div class="grid2"><div class="field"><label>Nom del grup</label><input name="name" required value="${esc(g.name)}"></div><div class="field"><label>Classificades d’aquest grup</label><input name="qualify" type="number" min="1" max="64" value="${g.qualify}"></div></div>${formatFields(g.format)}<div class="notice">Si canvies el reglament amb resultats introduïts, els partits ja disputats es conservaran. La nova norma s’aplicarà als partits que es generin després; pots modificar el reglament dels partits pendents individualment.</div>`,v=>{let newfmt={games:+v.games,tie:!!v.tie,tiePoints:+v.tiePoints,golden:!!v.golden};if(g.matches.some(m=>m.result)&&JSON.stringify(newfmt)!==JSON.stringify(g.format)&&!confirm('Ja hi ha resultats. Vols conservar-los i aplicar la nova norma només als partits pendents?'))return false;g.name=v.name;g.qualify=+v.qualify;g.format=newfmt;save();render()})}
function generateGroup(id){let c=cat(),g=c.groups.find(x=>x.id===id);if(g.pairIds.length<2)return toast('Calen almenys dues parelles al grup');if(g.matches.length&&!confirm('Regenerar els partits del grup? S’esborraran els resultats i horaris del grup i els encreuaments eliminatoris.'))return;g.matches=[];for(let i=0;i<g.pairIds.length;i++)for(let j=i+1;j<g.pairIds.length;j++)g.matches.push({id:uid(),a:g.pairIds[i],b:g.pairIds[j],result:null,time:'',court:'',format:{...g.format}});c.rounds=[];save();render();toast(`${g.matches.length} partits generats`)}
function standings(c,g){let r=g.pairIds.map((id,i)=>({id,name:pname(c,id),index:i,pj:0,pg:0,pp:0,jf:0,jc:0,diff:0}));let map=Object.fromEntries(r.map(x=>[x.id,x]));for(let m of g.matches){if(!m.result||!map[m.a]||!map[m.b])continue;let a=map[m.a],b=map[m.b],sa=m.result.a,sb=m.result.b;a.pj++;b.pj++;a.jf+=sa;a.jc+=sb;b.jf+=sb;b.jc+=sa;if(sa>sb){a.pg++;b.pp++}else if(sb>sa){b.pg++;a.pp++}}for(let x of r)x.diff=x.jf-x.jc;return r.sort((a,b)=>b.pg-a.pg||b.diff-a.diff||b.jf-a.jf||a.index-b.index)}
function allMatches(c){return [...c.groups.flatMap(g=>g.matches.map(m=>({...m,where:'Grup '+g.name}))),...c.rounds.flatMap(r=>r.matches.map(m=>({...m,where:r.name}))) ]}
function matchesView(){let c=cat();if(!c)return `<div class="empty">Crea una categoria primer.</div>`;return `<section class="panel">${categoryTabs()}<h2>Partits i horaris · ${esc(c.name)}</h2><p class="muted">Els horaris i les pistes s’assignen manualment. Prem «Resultat / horari» per editar cada partit.</p>${c.groups.map(g=>`<h3>Grup ${esc(g.name)}</h3>${renderMatches(c,g.matches,'group',g.id)}`).join('')}${c.rounds.map(r=>`<h3>${esc(r.name)}</h3>${renderMatches(c,r.matches,'round',r.id)}`).join('')}</section>`}
function renderMatches(c,ms,type,parent){if(!ms.length)return '<div class="empty" style="margin-bottom:16px">Encara no hi ha partits generats.</div>';return `<div class="matches" style="margin-bottom:20px">${ms.map((m,i)=>{let a=m.a,b=m.b,w=m.result?.winner;return `<article class="match"><div class="matchtop"><span>PARTIT ${i+1}</span><span>${m.time?esc(m.time):'Hora pendent'} ${m.court?' · Pista '+esc(m.court):''}</span></div><div class="teams"><div class="team ${w===a?'winner':''}"><span>${esc(pname(c,a))}</span><span class="score">${m.result?.bye?'BYE':m.result?m.result.a:'–'}</span></div><div class="team ${w===b?'winner':''}"><span>${esc(pname(c,b))}</span><span class="score">${m.result?.bye?'':m.result?m.result.b:'–'}</span></div></div><div class="matchfooter"><button class="btn small primary" onclick="editMatch('${type}','${parent}','${m.id}')">Resultat / horari</button><button class="btn small" onclick="editMatchFormat('${type}','${parent}','${m.id}')">⚙</button><span class="tag ${m.result?'win':'pending'}">${m.result?'Finalitzat':'Pendent'}</span></div></article>`}).join('')}</div>`}
function getMatch(type,parent,id){let c=cat(),p=type==='group'?c.groups.find(g=>g.id===parent):c.rounds.find(r=>r.id===parent);return p?.matches.find(m=>m.id===id)}
function editMatchFormat(type,parent,id){let c=cat(),m=getMatch(type,parent,id),r=type==='round'?c.rounds.find(x=>x.id===parent):null;if(!m)return;let f=m.format||(type==='group'?c.groups.find(g=>g.id===parent).format:c.knockout);modal('Reglament del partit',formatFields(f),v=>{if(m.result&&!m.result.bye&&!confirm('Canviar el reglament esborrarà el resultat d’aquest partit. Continuar?'))return false;let changed=!!m.result&&!m.result.bye;m.format={games:+v.games,tie:!!v.tie,tiePoints:+v.tiePoints,golden:!!v.golden};if(changed){m.result=null;if(type==='group'){if(c.rounds.length&&!confirm('També cal esborrar el quadre eliminatori. Continuar?'))return false;c.rounds=[]}else advance(c)}save();render()})}
function validScore(a,b,f,finalSets){if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a===b)return false;if(finalSets===3)return a<=2&&b<=2&&Math.max(a,b)===2;let n=f.games;return Math.max(a,b)===n && (f.tie?(Math.min(a,b)<=n-2||Math.min(a,b)===n-1):Math.min(a,b)<=n-2)}
function editMatch(type,parent,id){let c=cat(),m=getMatch(type,parent,id),r=type==='round'?c.rounds.find(r=>r.id===parent):null,fmt=m.format|| (type==='group'?c.groups.find(g=>g.id===parent).format:c.knockout),sets=r?.final&&c.knockout.finalSets===3?3:0;let result=m.result;if(result?.bye)return toast('Classificació automàtica per descans (bye)');modal('Resultat i horari',`<p class="muted">${esc(pname(c,m.a))} <b>vs.</b> ${esc(pname(c,m.b))}</p><div class="grid2"><div class="field"><label>Hora (manual)</label><input name="time" type="time" value="${esc(m.time||'')}"></div><div class="field"><label>Pista (manual)</label><input name="court" placeholder="1" value="${esc(m.court||'')}"></div></div><div class="notice">${sets?'Final al millor de 3 sets: introdueix sets guanyats (2–0 o 2–1).':esc(formatText(fmt))}. ${fmt.tie&&!sets?'En empat '+(fmt.games-1)+'–'+(fmt.games-1)+', el resultat final serà '+fmt.games+'–'+(fmt.games-1)+'.':''}</div><div class="grid2"><div class="field"><label>${esc(pname(c,m.a))}</label><input name="a" type="number" min="0" max="30" placeholder="Jocs" value="${result?.a??''}"></div><div class="field"><label>${esc(pname(c,m.b))}</label><input name="b" type="number" min="0" max="30" placeholder="Jocs" value="${result?.b??''}"></div></div><div class="field"><label class="checkline"><input name="clear" type="checkbox"> Esborrar resultat (conservar horari)</label></div>`,v=>{let hasA=v.a!==''&&v.a!=null,hasB=v.b!==''&&v.b!=null;let nr=null;if(!v.clear&&(hasA||hasB)){if(!m.a||!m.b){toast('Cal esperar que es coneguin les dues parelles');return false}if(!hasA||!hasB||!validScore(+v.a,+v.b,fmt,sets)){toast(sets?'Resultat invàlid: 2–0 o 2–1':'Marcador invàlid per al format configurat');return false}nr={a:+v.a,b:+v.b,winner:+v.a>+v.b?m.a:m.b}}if(type==='group'&&c.rounds.length&&JSON.stringify(m.result)!==JSON.stringify(nr)){if(!confirm('Modificar aquest resultat pot canviar la classificació. Caldrà regenerar les eliminatòries. Continuar?'))return false;c.ro function advance(c){for(let i=0;i<c.rounds.length-1;i++){let current=c.rounds[i].matches,next=c.rounds[i+1].matches;for(let j=0;j<next.length;j++){let a=current[j*2],b=current[j*2+1];let na=a?.result?.winner||null,nb=b?.result?.winner||null;let n=next[j];if(n.a!==na||n.b!==nb){n.a=na;n.b=nb;n.result=null}}}}
function bracketView(){let c=cat();if(!c)return `<div class="empty">Crea una categoria primer.</div>`;return `<section class="panel">${categoryTabs()}<div class="formrow"><h2 style="flex:1;margin:0">Quadre eliminatori · ${esc(c.name)}</h2><button class="btn" onclick="editKnockout()">Reglament eliminatòries</button><button class="btn primary" onclick="generateBracket()">Generar encreuaments</button></div><div class="notice">Per defecte, amb 2 grups de 4 parelles: 1A–4B, 2A–3B, 3A–2B i 4A–1B. Per altres formats, els primers classificats reben les millors posicions i s'eviten enfrontaments del mateix grup quan és possible. Pots modificar els classificats de cada grup.</div>${c.rounds.length?`<div class="bracket">${c.rounds.map(r=>`<div class="round"><h3>${esc(r.name)} <button class="btn small" onclick="editRoundFormat('${r.id}')">⚙ Reglament</button></h3>${r.matches.map((m,i)=>`<div class="match"><div class="matchtop">PARTIT ${i+1} <span>${esc(m.time||'Hora pendent')}</span></div><div class="teams"><div class="team ${m.result?.winner===m.a?'winner':''}"><span>${esc(pname(c,m.a))}</span><span class="score">${m.result?.bye?'BYE':m.result?m.result.a:'–'}</span></div><div class="team ${m.result?.winner===m.b?'winner':''}"><span>${esc(pname(c,m.b))}</span><span class="score">${m.result?.bye?'':m.result?m.result.b:'–'}</span></div></div><div class="matchfooter"><button class="btn small primary" onclick="editMatch('round','${r.id}','${m.id}')">Editar</button>${r===c.rounds[0]?`<button class="btn small" onclick="editDrawMatch('${m.id}')">Canviar creuament</button>`:''}</div></div>`).join('')}</div>`).join('')}</div>`:'<div class="empty">Encara no hi ha quadre. Finalitza la fase de grups i genera els encreuaments.</div>'}</section>`}
function editKnockout(){let c=cat();modal('Reglament eliminatòries',`${formatFields(c.knockout)}<div class="field"><label>Final al millor de</label><select name="finalSets">${opt(['1','3'],String(c.knockout.finalSets))}</select></div><div class="notice">Aquest reglament serà el valor inicial per a les noves eliminatòries. Cada ronda també es pot configurar per separat.</div>`,v=>{if(c.rounds.length&&!confirm('Actualitzar el reglament general? Les rondes ja creades mantindran el seu format fins que les editis.'))return false;c.knockout={games:+v.games,tie:!!v.tie,tiePoints:+v.tiePoints,golden:!!v.golden,finalSets:+v.finalSets};save();render()})}
function editRoundFormat(id){let c=cat(),r=c.rounds.find(x=>x.id===id);if(!r)return;let f=r.matches[0]?.format||c.knockout;modal('Reglament · '+r.name,`${formatFields(f)}${r.final?'<div class="field"><label>Final al millor de</label><select name="finalSets">'+opt(['1','3'],String(c.knockout.finalSets))+'</select></div>':''}<div class="notice">S’aplicarà a tots els partits d’aquesta ronda. Els resultats anteriors poden no ser vàlids amb el nou format.</div>`,v=>{let changed=r.matches.some(m=>m.result&&!m.result.bye);if(changed&&!confirm('Aquest canvi esborrarà els resultats de la ronda i de les rondes següents, però conservarà els horaris. Continuar?'))return false;let f={games:+v.games,tie:!!v.tie,tiePoints:+v.tiePoints,golden:!!v.golden};r.matches.forEach(m=>{m.format={...f};if(changed&&!m.result?.bye)m.result=null});if(r.final)c.knockout.finalSets=+v.finalSets;if(changed){let idx=c.rounds.indexOf(r);for(let k=idx+1;k<c.rounds.length;k++)c.rounds[k].matches.forEach(m=>{m.a=null;m.b=null;m.result=null});advance(c)}save();render()})}
function editDrawMatch(id){let c=cat(),r=c.rounds[0],m=r?.matches.find(x=>x.id===id);if(!m)return;let eligible=[...new Set(r.matches.flatMap(x=>[x.a,x.b]).filter(Boolean))];let choices=[{id:'',name:'Descans (bye)'},...eligible.map(id=>({id,name:pname(c,id)}))];let options=(value)=>choices.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('');modal('Editar encreuament inicial',`<div class="field"><label>Parella 1</label><select name="a">${options(m.a||'')}</select></div><div class="field"><label>Parella 2</label><select name="b">${options(m.b||'')}</select></div><div class="notice">Per evitar duplicats, intercanviarem automàticament les parelles que moguis. Es reiniciaran els resultats de les eliminatòries, però es conservaran els horaris.</div>`,v=>{if(v.a===v.b&&v.a){toast('Una parella no pot jugar contra ella mateixa');return false}if(!confirm('Canviar el quadre i esborrar els resultats eliminatoris?'))return false;let old=[m.a,m.b],next=[v.a||null,v.b||null];let all=r.matches.flatMap(x=>[x.a,x.b]).filter(Boolean);if(next.some(id=>id&&!all.includes(id))){toast('Parella no vàlida');return false}let assigned=new Set(next.filter(Boolean));let displaced=old.filter(id=>id&&!assigned.has(id));for(let x of r.matches){if(x===m)continue;for(let side of ['a','b'])if(assigned.has(x[side]))x[side]=displaced.shift()||null}m.a=next[0];m.b=next[1];for(let round of c.rounds)for(let x of round.matches){x.result=null;if(round!==r){x.a=null;x.b=null}}for(let x of r.matches)if(!!x.a!==!!x.b)x.result={a:0,b:0,winner:x.a||x.b,bye:true};advance(c);save();render()})}
function generateBracket(){let c=cat(),gs=c.groups.filter(g=>g.pairIds.length);if(gs.length<1)return toast('Calen grups amb parelles');if(gs.some(g=>g.matches.length===0||g.matches.some(m=>!m.result)))return toast('Cal completar tots els partits de la fase de grups');let qualifiers=gs.flatMap(g=>standings(c,g).slice(0,Math.min(g.qualify,g.pairIds.length)).map((r,i)=>({...r,group:g.name,position:i+1})));let count=qualifiers.length;if(count<2)return toast('Calen almenys dues parelles classificades');if(count>64)return toast('Màxim 64 classificades');if(c.rounds.length&&!confirm('Regenerar el quadre? Es perdran els resultats i horaris de les eliminatòries.'))return;
// Standard two groups of four: quarterfinal bracket pairing ensures semi-finals between winners of 1A/4B vs 2B/3A, etc.
let ordered;if(gs.length===2&&gs.every(g=>Math.min(g.qualify,g.pairIds.length)===4)){let A=standings(c,gs[0]),B=standings(c,gs[1]);ordered=[A[0].id,B[3].id,B[1].id,A[2].id,B[0].id,A[3].id,A[1].id,B[2].id]}else{qualifiers.sort((a,b)=>a.position-b.position||a.group.localeCompare(b.group));let n=2**Math.ceil(Math.log2(count)),seeded=Array(n).fill(null);qualifiers.forEach((q,i)=>seeded[i]=q.id);let positions=[1,2];while(positions.length<n){let m=positions.length*2;positions=positions.flatMap(x=>[x,m+1-x])}ordered=positions.map(pos=>seeded[pos-1]||null); // first-round seeds vs byes

let rounds=[],n=ordered.length,roundCount=Math.log2(n);for(let k=0;k<roundCount;k++){let sz=n/2**(k+1),name=sz===1?'Final':sz===2?'Semifinals':sz===4?'Quarts de final':sz===8?'Vuitens de final':`Ronda de ${sz*2}`;rounds.push({id:uid(),name,final:sz===1,matches:Array.from({length:sz},(_,i)=>({id:uid(),a:k===0?ordered[i*2]:null,b:k===0?ordered[i*2+1]:null,result:null,time:'',court:'',format:{...c.knockout}}))})}c.rounds=rounds;

for(let i=0;i<rounds[0].matches.length;i++){let m=rounds[0].matches[i];if((m.a&&!m.b)||(!m.a&&m.b))m.result={a:m.a?1:0,b:m.b?1:0,winner:m.a||m.b,bye:true}}advance(c);save();render();toast('Quadre eliminatori generat')}

function modal(title,body,onSubmit){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;let f=document.getElementById('dialog-form');f.onsubmit=e=>{e.preventDefault();let v={};for(let el of f.elements){if(!el.name)continue;v[el.name]=el.type==='checkbox'?el.checked:el.value}if(onSubmit(v)!==false)closeDialog()};document.getElementById('dialog').showModal()}function closeDialog(){document.getElementById('dialog').close()}
function exportData(){let blob=new Blob([JSON.stringify({...data,exported:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='les-cabanyes-tornejos-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Còpia exportada. Desa-la a Fitxers o Drive.')}
document.getElementById('importfile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.tournaments)||!d.tournaments.length||!d.tournaments.every(t=>t.id&&Array.isArray(t.categories)))throw Error('Format invàlid');if(!confirm('Restaurar aquesta còpia substituirà totes les dades actuals. Continuar?'))return;data=d;data.active=data.tournaments.some(t=>t.id===data.active)?data.active:data.tournaments[0].id;selectedCat='';selectedGroup='';save();render();toast('Còpia restaurada')}catch(err){toast('No s’ha pogut llegir el fitxer JSON')}finally{e.target.value=''}});
document.getElementById('logofile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>1500000){toast('Logo massa gran. Màxim 1,5 MB');return}let r=new FileReader();r.onload=()=>{data.logo=r.result;save();render();toast('Logo incorporat')};r.readAsDataURL(f);e.target.value=''});
window.getTournamentForPublish=()=>JSON.parse(JSON.stringify(active()));window.cloudRefresh=()=>{if(page==='settings')render()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script type="module" src="./cloud-admin.js"></script></body></html>
