<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303438"><title>Resultats · Pàdel Indoor Les Cabanyes</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#303438;background:#f0f1f2}*{box-sizing:border-box}body{margin:0}header{background:#303438;color:white;padding:18px max(18px,calc((100vw - 1050px)/2));display:flex;align-items:center;gap:16px}header img{width:72px;max-height:65px;object-fit:contain}header h1{font-size:20px;margin:0}header small{color:#c9cccf}main{max-width:1050px;margin:22px auto;padding:0 16px}h2{font-size:23px;margin:0 0 10px}.meta{color:#70777c;margin-bottom:18px}.panel{background:white;border:1px solid #dddfe1;border-radius:14px;padding:17px;margin:14px 0;overflow:auto}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,select{padding:12px;border:1px solid #cdd1d4;border-radius:9px;background:white;color:#303438;font:inherit}.tabs button.active{background:#303438;color:white}select{width:100%;max-width:420px}table{width:100%;border-collapse:collapse;min-width:400px}th,td{padding:11px 8px;text-align:left;border-bottom:1px solid #e9ebed;font-size:14px}th{background:#f4f5f6}.qualified{background:#f0f6f1}.match{border:1px solid #e1e3e5;border-radius:10px;padding:12px;margin:9px 0;min-width:190px;background:#fff}.teams{display:grid;grid-template-columns:1fr auto;gap:9px}.winner{font-weight:750}.sub{color:#7c8185;font-size:12px;margin-bottom:9px}.bracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px}.round{min-width:225px;flex:1}.round h4{margin:0 0 8px}.empty{color:#6c747a;padding:20px}.stamp{font-size:12px;color:#72787c}a{color:inherit}footer{text-align:center;color:#7b8085;padding:22px;font-size:12px}@media(max-width:600px){header h1{font-size:17px}header img{width:56px}.panel{padding:12px}main{margin:15px auto}}</style></head><body>
<header><img src="logo-oficial.png" alt="Logo oficial"><div><small>PÀDEL INDOOR LES CABANYES</small><h1>Resultats i classificacions</h1></div></header>
<main><div id="status" class="panel">Carregant resultats…</div><div id="content" hidden><h2 id="title"></h2><div class="meta" id="meta"></div><div class="panel"><label for="category">Categoria</label><p><select id="category"></select></p><div class="tabs"><button id="tab-groups" class="active">Grups i classificació</button><button id="tab-matches">Partits</button><button id="tab-bracket">Quadre final</button></div></div><div id="results"></div><p id="updated" class="stamp"></p></div></main><footer>Consulta pública · Només lectura · Pàdel Indoor Les Cabanyes</footer>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;', '"':'&quot;',"'":'&#39;'}[c]));
let tournament=null,categoryId='',tab='groups';const tid=new URLSearchParams(location.search).get('t');
const pName=(c,id)=>c.pairs?.find(p=>p.id===id)?.name||'Per determinar';
function standings(c,g){const map=new Map((g.pairIds||[]).map(id=>[id,{id,pj:0,v:0,d:0,f:0}]));for(const m of g.matches||[]){if(!m.result||m.result.bye)continue;const a=map.get(m.a),b=map.get(m.b);if(!a||!b)continue;const x=Number(m.result.a),y=Number(m.result.b);if(!Number.isFinite(x)||!Number.isFinite(y))continue;a.pj++;b.pj++;a.f+=x;b.f+=y;a.d+=x-y;b.d+=y-x;if(x>y)a.v++;else if(y>x)b.v++}return [...map.values()].sort((a,b)=>b.v-a.v||b.d-a.d||b.f-a.f)}
const matchCard=(c,m)=>`<div class="match"><div class="sub">${esc(m.time||'Hora pendent')}${m.court?' · Pista '+esc(m.court):''}</div><div class="teams"><span class="${m.result?.winner===m.a?'winner':''}">${esc(pName(c,m.a))}</span><b>${m.result?.bye?'Descans':m.result?esc(m.result.a):'–'}</b><span class="${m.result?.winner===m.b?'winner':''}">${esc(pName(c,m.b))}</span><b>${m.result?.bye?'':m.result?esc(m.result.b):'–'}</b></div></div>`;
function draw(){if(!tournament)return;const c=tournament.categories?.find(x=>x.id===categoryId)||tournament.categories?.[0];$('title').textContent=tournament.name;$('meta').textContent=[tournament.date,tournament.start&&'Inici '+tournament.start].filter(Boolean).join(' · ');$('category').innerHTML=(tournament.categories||[]).map(x=>`<option value="${esc(x.id)}" ${x.id===c?.id?'selected':''}>${esc(x.name)}</option>`).join('');for(const x of ['groups','matches','bracket'])$('tab-'+x).classList.toggle('active',tab===x);if(!c){$('results').innerHTML='<div class="panel empty">Encara no hi ha categories.</div>';return}
let html='';if(tab==='groups'){for(const g of c.groups||[]){const st=standings(c,g);html+=`<section class="panel"><h3>Grup ${esc(g.name)}</h3><table><thead><tr><th>#</th><th>Parella</th><th>PJ</th><th>V</th><th>DG</th><th>JF</th></tr></thead><tbody>${st.map((x,i)=>`<tr class="${i<(g.qualify||0)?'qualified':''}"><td>${i+1}</td><td>${esc(pName(c,x.id))}</td><td>${x.pj}</td><td>${x.v}</td><td>${x.d>0?'+':''}${x.d}</td><td>${x.f}</td></tr>`).join('')}</tbody></table><p class="stamp">Verd: posicions classificades segons la configuració actual.</p></section>`}}
if(tab==='matches'){for(const g of c.groups||[])html+=`<section class="panel"><h3>Grup ${esc(g.name)}</h3>${(g.matches||[]).length?g.matches.map(m=>matchCard(c,m)).join(''):'<p class="empty">Partits pendents de generar</p>'}</section>`}
if(tab==='bracket')html=`<section class="panel"><h3>Eliminatòries</h3>${c.rounds?.length?'<div class="bracket">'+c.rounds.map(r=>`<div class="round"><h4>${esc(r.name)}</h4>${r.matches.map(m=>matchCard(c,m)).join('')}</div>`).join('')+'</div>':'<p class="empty">El quadre encara no s’ha publicat.</p>'}</section>`;
$('results').innerHTML=html}
$('category').onchange=e=>{categoryId=e.target.value;draw()};for(const t of ['groups','matches','bracket'])$('tab-'+t).onclick=()=>{tab=t;draw()};
if(!firebaseConfig.apiKey||!firebaseConfig.projectId){$('status').textContent='La publicació encara no està configurada.'}
else try{const [{initializeApp},{getFirestore,doc,onSnapshot,collection,query,orderBy,limit}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);const db=getFirestore(initializeApp(firebaseConfig));const source=tid?doc(db,'publicTournaments',tid):query(collection(db,'publicTournaments'),orderBy('updatedAt','desc'),limit(1));onSnapshot(source,result=>{const snap=tid?result:result.docs[0];if(!snap?.exists()){$('status').textContent='Encara no hi ha resultats publicats per a aquest enllaç.';$('content').hidden=true;return}const v=snap.data();tournament=v.tournament;categoryId=tournament.categories?.some(c=>c.id===categoryId)?categoryId:tournament.categories?.[0]?.id;$('status').hidden=true;$('content').hidden=false;$('updated').textContent='Darrera publicació: '+(v.updatedAt?.toDate?.().toLocaleString('ca-ES')||'recent');draw()},err=>{$('status').hidden=false;$('status').textContent='No es poden consultar els resultats: '+err.message})}catch(e){$('status').textContent='Error de connexió: '+e.message}
</script></body></html>
